name: Compilar COBOL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar GNUCobol
        run: sudo apt-get update && sudo apt-get install -y gnucobol
      - name: Validar fontes
        run: |
          find . -name "*.cob" -print0 | xargs -0 -n1 cobc -free -fsyntax-only
